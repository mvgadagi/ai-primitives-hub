name: AI Primitives Hub primitives review
description: >-
  Review the AI primitives (prompts, instructions, agents, skills) that match the given path
  patterns, or only those changed in a pull request, against a quality rubric with Gemma 4 on
  the runner. Passes or fails on a grade threshold and posts the report on the pull request.

inputs:
  paths:
    description: >-
      Space- or newline-separated glob patterns of files to review, for example `*`,
      `skills/*`, `prompts/*.prompt.md`. `*` also matches `/`; a directory means everything under
      it; prefix with `!` to exclude.
    required: false
    default: '*'
  scope:
    description: "`changed` reviews only files added or modified in the pull request; `all` reviews every matching file; `auto` is `changed` on pull requests and `all` otherwise."
    required: false
    default: auto
  fail-below:
    description: Fail when any reviewed primitive grades below this letter (A best, E worst). Empty never fails.
    required: false
    default: C
  comment:
    description: "Post the report as a pull request comment, updated on every run ('true' or 'false'). Needs pull-requests write permission."
    required: false
    default: 'true'
  github-token:
    description: Token used to list pull request files and post the comment.
    required: false
    default: ${{ github.token }}
  rubric-file:
    description: Custom rubric JSON (same shape as rubric.json in this action).
    required: false
    default: ''
  model:
    description: Ollama model tag.
    required: false
    default: gemma4:e2b
  cli-version:
    description: >-
      Exact @ai-primitives-hub/cli version that includes `security scan`. When set, static
      scanner findings are shown and cap the matching rubric scores.
    required: false
    default: ''
  scanner-command:
    description: >-
      Advanced: command that runs an AI Primitives Hub CLI built in your repository (for example
      `node packages/cli/bin/ai-primitives-hub.js`). Overrides cli-version. Split on spaces, never
      evaluated by a shell.
    required: false
    default: ''
  include-llm-controls:
    description: Pass --include-llm-controls to the static scanner ('true' or 'false').
    required: false
    default: 'false'
  max-files:
    description: Maximum number of primitives to review.
    required: false
    default: '20'
  max-file-bytes:
    description: Bytes of each primitive sent to the model; longer files are truncated and flagged.
    required: false
    default: '12000'
  num-ctx:
    description: Model context window in tokens.
    required: false
    default: '16384'
  max-tokens:
    description: Maximum tokens per review answer.
    required: false
    default: '2048'
  request-timeout:
    description: Seconds to wait for each review answer.
    required: false
    default: '600'
  step-summary:
    description: Append the report to the job summary ('true' or 'false').
    required: false
    default: 'true'
  ollama-version:
    description: Pinned Ollama release installed when the runner has none.
    required: false
    default: v0.40.13
  ollama-host:
    description: host:port for the Ollama server. Keep it on loopback.
    required: false
    default: 127.0.0.1:11434
  cache:
    description: Cache the Ollama runtime and model ('true' or 'false').
    required: false
    default: 'true'

outputs:
  status:
    description: "`success` or `failure`."
    value: ${{ steps.report.outputs.status }}
  reviewed:
    description: Number of primitives reviewed.
    value: ${{ steps.report.outputs.reviewed }}
  failed:
    description: Number of primitives below the required grade.
    value: ${{ steps.report.outputs.failed }}
  average-score:
    description: Average score (0-100) across reviewed primitives.
    value: ${{ steps.report.outputs.average-score }}
  lowest-grade:
    description: Lowest grade (A best, E worst).
    value: ${{ steps.report.outputs.lowest-grade }}
  report-json:
    description: Path of the JSON report.
    value: ${{ steps.report.outputs.report-json }}
  report-markdown:
    description: Path of the Markdown report.
    value: ${{ steps.report.outputs.report-markdown }}

runs:
  using: composite
  steps:
    - name: Select primitives
      id: collect
      shell: bash
      env:
        WORK_DIR: ${{ runner.temp }}/primitives-review-work
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_CLI_VERSION: ${{ inputs.cli-version }}
        INPUT_INCLUDE_LLM_CONTROLS: ${{ inputs.include-llm-controls }}
        SCANNER_CMD: ${{ inputs.scanner-command }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/collect.sh"

    - name: Resolve Ollama
      id: resolve
      if: steps.collect.outputs.count != '0'
      shell: bash
      env:
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OLLAMA_VERSION: ${{ inputs.ollama-version }}
        INPUT_OLLAMA_HOST: ${{ inputs.ollama-host }}
      run: bash "$GITHUB_ACTION_PATH/../gemma4/scripts/resolve.sh"

    - name: Restore Ollama runtime
      id: runtime-cache
      if: steps.collect.outputs.count != '0' && inputs.cache == 'true' && steps.resolve.outputs.install == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.install-dir }}
        key: ${{ steps.resolve.outputs.runtime-cache-key }}

    - name: Restore model
      id: model-cache
      if: steps.collect.outputs.count != '0' && inputs.cache == 'true' && steps.resolve.outputs.server-running == 'false'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.models-dir }}
        key: ${{ steps.resolve.outputs.model-cache-key }}

    - name: Start Ollama and pull model
      if: steps.collect.outputs.count != '0'
      shell: bash
      env:
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_OLLAMA_VERSION: ${{ inputs.ollama-version }}
        INPUT_KEEP_ALIVE: 30m
        RESOLVED_OS: ${{ steps.resolve.outputs.os }}
        RESOLVED_ARCH: ${{ steps.resolve.outputs.arch }}
        RESOLVED_HOST: ${{ steps.resolve.outputs.host }}
        RESOLVED_BASE_URL: ${{ steps.resolve.outputs.base-url }}
        RESOLVED_INSTALL: ${{ steps.resolve.outputs.install }}
        RESOLVED_INSTALL_DIR: ${{ steps.resolve.outputs.install-dir }}
        RESOLVED_MODELS_DIR: ${{ steps.resolve.outputs.models-dir }}
        RESOLVED_SERVER_RUNNING: ${{ steps.resolve.outputs.server-running }}
      run: bash "$GITHUB_ACTION_PATH/../gemma4/scripts/setup.sh"

    - name: Save Ollama runtime
      if: steps.collect.outputs.count != '0' && inputs.cache == 'true' && steps.resolve.outputs.install == 'true' && steps.runtime-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.install-dir }}
        key: ${{ steps.resolve.outputs.runtime-cache-key }}

    - name: Save model
      if: steps.collect.outputs.count != '0' && inputs.cache == 'true' && steps.resolve.outputs.server-running == 'false' && steps.model-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.models-dir }}
        key: ${{ steps.resolve.outputs.model-cache-key }}

    - name: Review primitives
      if: steps.collect.outputs.count != '0'
      shell: bash
      env:
        PRIMITIVES_FILE: ${{ runner.temp }}/primitives-review-work/primitives.jsonl
        FINDINGS_FILE: ${{ runner.temp }}/primitives-review-work/findings.jsonl
        RUBRIC_FILE: ${{ inputs.rubric-file || format('{0}/rubric.json', github.action_path) }}
        OUT_FILE: ${{ runner.temp }}/primitives-review-work/results.jsonl
        BASE_URL: ${{ steps.resolve.outputs.base-url }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_NUM_CTX: ${{ inputs.num-ctx }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_MAX_FILE_BYTES: ${{ inputs.max-file-bytes }}
        INPUT_REQUEST_TIMEOUT: ${{ inputs.request-timeout }}
      run: bash "$GITHUB_ACTION_PATH/scripts/review.sh"

    - name: Report, comment and set status
      id: report
      shell: bash
      env:
        RESULTS_FILE: ${{ runner.temp }}/primitives-review-work/results.jsonl
        RUBRIC_FILE: ${{ inputs.rubric-file || format('{0}/rubric.json', github.action_path) }}
        REPORT_DIR: ${{ runner.temp }}/primitives-review
        SCOPE: ${{ steps.collect.outputs.scope }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_FAIL_BELOW: ${{ inputs.fail-below }}
        INPUT_STEP_SUMMARY: ${{ inputs.step-summary }}
        INPUT_COMMENT: ${{ inputs.comment }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/scripts/report.sh"

    - name: Upload report
      if: always() && steps.report.outputs.report-json != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: primitives-review
        path: ${{ runner.temp }}/primitives-review
        if-no-files-found: warn
