# Releases core, infra, app, cli and the VS Code extension together under one
# shared version (ADR-0011). Keep this file name: npm trusted publishing is
# configured for `packages-release.yml`.
name: Release AI Primitives Hub

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semantic version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Publish an npm-only prerelease of the bumped version (nothing is committed, the extension is not published)"
        required: false
        default: false
        type: boolean
      preid:
        description: "Prerelease id (prerelease only)"
        required: false
        default: "alpha"
        type: string
      npm_tag:
        description: "npm distribution tag (prerelease only; stable releases use latest)"
        required: true
        default: "next"
        type: choice
        options:
          - next
          - alpha
          - beta
      dry_run:
        description: "Preview only: validate and build without publishing, pushing a branch or creating a PR"
        required: false
        default: false
        type: boolean
      skip_checks:
        description: "Skip lint and test gates (the publication build still runs)"
        required: false
        default: false
        type: boolean

  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PACKAGE_NAMES: "core infra app cli"

jobs:
  prepare:
    name: Prepare release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate release request
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be prepared from main (received $GITHUB_REF)." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Bump the shared version
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          PRERELEASE: ${{ inputs.prerelease }}
          PREID: ${{ inputs.preid }}
        run: |
          set -euo pipefail
          args=("$RELEASE_TYPE")
          if [[ "$PRERELEASE" == "true" ]]; then
            # The run number keeps repeated prereleases of one version unique.
            args+=(--preid "$PREID" --build "$GITHUB_RUN_NUMBER")
          fi
          version="$(node scripts/set-version.mjs "${args[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Update lockfile
        run: pnpm install --lockfile-only --ignore-scripts --prefer-offline

      - name: Commit version bump
        id: branch
        if: ${{ !inputs.prerelease }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          release_branch="release/v$VERSION/$GITHUB_RUN_ID"
          git switch --create "$release_branch"
          git add pnpm-lock.yaml packages/*/package.json apps/vscode-extension/package.json \
            apps/vscode-extension/templates/scaffolds/github/package.template.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): v$VERSION"
          echo "name=$release_branch" >> "$GITHUB_OUTPUT"

      - name: Build release packages
        run: pnpm --filter "@ai-primitives-hub/*..." build

      - name: Verify CLI reported version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          expected="ai-primitives-hub $VERSION"
          actual="$(node packages/cli/bin/ai-primitives-hub.js --version)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The built CLI reports '$actual' but the release expects '$expected'."
            exit 1
          fi
          echo "The built CLI reports '$actual'."

      - name: Lint and test release packages
        if: ${{ !inputs.skip_checks }}
        run: |
          set -euo pipefail
          pnpm --filter "@ai-primitives-hub/*..." lint
          pnpm --filter "@ai-primitives-hub/*..." test

      - name: Stage release build artifact
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          NPM_TAG: ${{ inputs.prerelease && inputs.npm_tag || 'latest' }}
        run: |
          set -euo pipefail
          rm -rf .release-artifacts
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const childProcess = require('node:child_process');

          const packages = process.env.PACKAGE_NAMES.split(/\s+/).filter(Boolean).map((directory) => {
            const packageJson = JSON.parse(fs.readFileSync(path.join('packages', directory, 'package.json'), 'utf8'));
            const distPath = path.join('packages', directory, 'dist');
            if (!fs.existsSync(distPath)) {
              throw new Error(`Expected build output is missing: ${distPath}`);
            }
            fs.cpSync(distPath, path.join('.release-artifacts', 'packages', directory, 'dist'), { recursive: true });
            return { directory, name: packageJson.name, version: packageJson.version };
          });

          const manifest = {
            formatVersion: 2,
            runId: Number(process.env.GITHUB_RUN_ID),
            sourceCommit: childProcess.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            version: process.env.VERSION,
            prerelease: process.env.PRERELEASE === 'true',
            npmTag: process.env.NPM_TAG,
            packages,
          };
          fs.mkdirSync('.release-artifacts', { recursive: true });
          fs.writeFileSync('.release-artifacts/release-manifest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload release build artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: .release-artifacts
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

      - name: Push release branch
        if: ${{ !inputs.dry_run && !inputs.prerelease }}
        env:
          RELEASE_BRANCH: ${{ steps.branch.outputs.name }}
        run: git push --set-upstream origin "$RELEASE_BRANCH"

      - name: Create release pull request
        if: ${{ !inputs.dry_run && !inputs.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.branch.outputs.name }}
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/release-pr-body.md"
          {
            echo "## Release v$VERSION"
            echo
            echo "This pull request was prepared by the release workflow."
            echo
            echo "- Version: \`$VERSION\` (\`$RELEASE_TYPE\` bump)"
            echo "- npm: \`@ai-primitives-hub/{core,infra,app,cli}\` under the \`latest\` tag"
            echo "- VS Code Marketplace and Open VSX: \`AmadeusITGroup.prompt-registry\`"
            echo "- Build artifact: workflow run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo "Merging tags \`v$VERSION\`, publishes the npm packages from the validated artifact, creates the GitHub Release and publishes the extension."
          } > "$body_file"

          existing_pr_url=$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url')
          if [[ -n "$existing_pr_url" ]]; then
            echo "Release pull request already exists: $existing_pr_url"
          else
            gh pr create --base main --head "$RELEASE_BRANCH" --title "chore(release): v$VERSION" --body-file "$body_file"
          fi

  publish-prerelease:
    name: Publish npm prerelease
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: npmjs
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Download release build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: .release-artifacts

      - name: Apply the prerelease version and build output
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          PREID: ${{ inputs.preid }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          version="$(node scripts/set-version.mjs "$RELEASE_TYPE" --preid "$PREID" --build "$GITHUB_RUN_NUMBER")"
          if [[ "$version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Computed $version but the prepared artifact is $EXPECTED_VERSION."
            exit 1
          fi
          for name in $PACKAGE_NAMES; do
            rm -rf "packages/$name/dist"
            cp -R ".release-artifacts/packages/$name/dist" "packages/$name/dist"
          done

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Publish prerelease packages to npmjs
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          set -euo pipefail
          for name in $PACKAGE_NAMES; do
            version=$(node -p "require('./packages/$name/package.json').version")
            if npm view "@ai-primitives-hub/$name@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "@ai-primitives-hub/$name@$version is already published; skipping it for an idempotent retry."
              continue
            fi
            pnpm --filter "@ai-primitives-hub/$name" publish \
              --access public \
              --tag "$NPM_TAG" \
              --no-git-checks \
              --ignore-scripts \
              --provenance
          done

  publish:
    name: Tag and publish merged release
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'release/v') }}
    runs-on: ubuntu-latest
    environment: npmjs
    permissions:
      contents: write
      actions: read
      id-token: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Determine release
        id: release
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_BRANCH" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)/([0-9]+)$ ]]; then
            echo "The merged pull request is not a recognized release branch: $RELEASE_BRANCH" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "artifact_run_id=${BASH_REMATCH[2]}"
          } >> "$GITHUB_OUTPUT"

      - name: Check the shared version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/check-versions.mjs
          actual=$(node -p "require('./apps/vscode-extension/package.json').version")
          if [[ "$actual" != "$VERSION" ]]; then
            echo "::error::The merged packages are at $actual, but the release branch is for $VERSION."
            exit 1
          fi

      - name: Download release build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.artifact_run_id }}
          path: .release-artifacts

      - name: Verify release artifact
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARTIFACT_RUN_ID: ${{ steps.release.outputs.artifact_run_id }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const fail = (message) => {
            throw new Error(message);
          };
          const expectedNames = process.env.PACKAGE_NAMES.split(/\s+/).filter(Boolean);
          const manifestPath = path.join('.release-artifacts', 'release-manifest.json');
          if (!fs.existsSync(manifestPath)) fail(`Release manifest is missing: ${manifestPath}`);

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.formatVersion !== 2) fail('Unsupported release artifact format.');
          if (manifest.runId !== Number(process.env.ARTIFACT_RUN_ID)) fail('Release artifact run does not match the release branch.');
          if (manifest.version !== process.env.VERSION) fail('Release artifact version does not match the release branch.');
          if (manifest.prerelease !== false || manifest.npmTag !== 'latest') fail('Release artifact is not a stable release.');
          if (!/^[0-9a-f]{40}$/.test(manifest.sourceCommit)) fail('Release artifact source commit is invalid.');
          if (manifest.sourceCommit !== process.env.RELEASE_HEAD_SHA) fail('Release artifact was not built from the merged pull request head.');

          const actualNames = manifest.packages.map((entry) => entry.directory);
          if (actualNames.join('\n') !== expectedNames.join('\n')) fail('Release artifact package selection is unexpected.');

          for (const entry of manifest.packages) {
            const packageJson = JSON.parse(fs.readFileSync(path.join('packages', entry.directory, 'package.json'), 'utf8'));
            if (packageJson.name !== entry.name || packageJson.version !== entry.version || entry.version !== manifest.version) {
              fail(`Merged package metadata does not match the validated artifact: ${entry.name}`);
            }
            const distPath = path.join('.release-artifacts', 'packages', entry.directory, 'dist');
            if (!fs.existsSync(distPath)) fail(`Build output is missing from the release artifact: ${distPath}`);
            fs.rmSync(path.join('packages', entry.directory, 'dist'), { recursive: true, force: true });
            fs.cpSync(distPath, path.join('packages', entry.directory, 'dist'), { recursive: true });
          }
          NODE

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Check npm versions before tagging
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          for name in $PACKAGE_NAMES; do
            if npm view "@ai-primitives-hub/$name@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              if ! git show-ref --tags --verify --quiet "refs/tags/$TAG" || [[ "$(git rev-list -n 1 "$TAG")" != "$MERGE_SHA" ]]; then
                echo "@ai-primitives-hub/$name@$VERSION already exists without the expected release tag $TAG." >&2
                exit 1
              fi
              echo "@ai-primitives-hub/$name@$VERSION is already published by this release; retry will leave it unchanged."
            fi
          done

      - name: Create and push the release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            tag_sha=$(git rev-list -n 1 "$TAG")
            if [[ "$tag_sha" != "$MERGE_SHA" ]]; then
              echo "Tag $TAG already exists at $tag_sha, not $MERGE_SHA." >&2
              exit 1
            fi
            echo "Tag $TAG already points at the merged release; leaving it unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$MERGE_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish packages to npmjs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for name in $PACKAGE_NAMES; do
            echo "Publishing @ai-primitives-hub/$name@$VERSION ..."
            if npm view "@ai-primitives-hub/$name@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "@ai-primitives-hub/$name@$VERSION is already published; skipping it for an idempotent retry."
              continue
            fi
            pnpm --filter "@ai-primitives-hub/$name" publish \
              --access public \
              --tag latest \
              --no-git-checks \
              --ignore-scripts \
              --provenance
          done

      # A release created with GITHUB_TOKEN does not trigger other workflows,
      # so the extension is published by the publish-extension job below.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

  publish-extension:
    name: Publish the VS Code extension
    needs: publish
    permissions:
      contents: write
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/vscode-extension-secure-publish.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
